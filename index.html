const DENOM_SIZE_RULES = {
  "500000": { widths:[61,62,63,64,65,66], lengths:[148,149,150,151,152] },
  "200000": { widths:[61,62,63,64,65,66], lengths:[145,146,147,148] },
  "100000": { widths:[61,62,63,64,65,66], lengths:[140,141,142,143,144] },
  "50000":  { widths:[61,62,63,64,65],    lengths:[137,138,139,140] }
};
let allRecords=[], lastBlocks=[], resultBinBytes=null, csvData="";
const $=id=>document.getElementById(id);
function logLine(s){$("log").textContent+=s+"\n"}
function hex2(v){return Number(v??0).toString(16).toUpperCase().padStart(2,"0")}
function rawHex(a,b){return ((a<<8)|b).toString(16).toUpperCase().padStart(4,"0")}
function rawDenomHex(a,b){return rawHex(a,b)}
function rejectCodeFromRecord(r){return rawDenomHex(r[14],r[15])}
function isValidDenomCode(c){return VALID_DENOM_CODES.has(String(c||"").toUpperCase())}
function displayDenom(r){
  const map={"500000":"500k","200000":"200k","100000":"100k","50000":"50k","20000":"20k","10000":"10k"};
  if(r && r.denomHex && isValidDenomCode(r.denomHex)){
    return map[String(r.denom)] || String(r.denom);
  }
  return (r && r.denomHex) ? String(r.denomHex).toUpperCase() : "";
}
function decodeSerial(r){let s="";for(let i=41;i<=59;i+=2)if(r[i])s+=String.fromCharCode(r[i]);return s}
function decodeSkewDegree(byte16){
  const v=Number(byte16)&0xFF;
  if((v&0xC0)===0xC0) return {valid:true,side:"L",degree:v&0x3F,label:"L"+(v&0x3F),raw:v};
  if((v&0xC0)===0x40) return {valid:true,side:"R",degree:v&0x3F,label:"R"+(v&0x3F),raw:v};
  return {valid:false,side:"",degree:null,label:"—",raw:v};
}
function isRejectBySize(denom,w,l){const q=DENOM_SIZE_RULES[String(denom||"")];return q?!q.widths.includes(Number(w))||!q.lengths.includes(Number(l)):false}
function rejectMeaning(c){return ERROR_CODE_MEANINGS[c]||NON_REJECT_CODE_MEANINGS[c]||""}
function denomCodeMeaning(c){return DENOM_CODE_MEANINGS[String(c||"").toUpperCase()]||""}
function displayErrorMeaning(r){
  if(!r) return "";
  const denomHex=String(r.denomHex||"").toUpperCase();
  if(denomHex && !isValidDenomCode(denomHex)){
    const dm=denomCodeMeaning(denomHex);
    if(dm) return dm;
  }
  return r.errorMeaning||"";
}
function sizeRejectMeaning(denom,w,l){
  const q=DENOM_SIZE_RULES[String(denom||"")];
  if(!q)return "";
  const badW=!q.widths.includes(Number(w)), badL=!q.lengths.includes(Number(l));
  if(badW&&badL)return `RejectBySize: Width ${w} & Length ${l}`;
  if(badW)return `RejectBySize: Width ${w}`;
  if(badL)return `RejectBySize: Length ${l}`;
  return "";
}
function bytesEq(buf,off,pat){if(off<0||off+pat.length>buf.length)return false;for(let i=0;i<pat.length;i++)if(buf[off+i]!==pat[i])return false;return true}
function dtHexFromBlock(b){return Array.from(b.slice(12,17)).map(hex2).join("")}
function parseDateQuery(input){
  const text=String(input||"").trim();
  let code,match;
  // Header +12..+16 stores BCD YY MM DD HH mm; seconds are not part of the key.
  if((match=text.match(/^(\d{1,2})([\/.-])(\d{1,2})\2(\d{4})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/))){
    const [,day,,month,year,hour,minute,second]=match;
    if(Number(year)<2000||Number(year)>2099||Number(second||0)>59)throw new Error("Ngày giờ ngoài phạm vi hợp lệ.");
    code=year.slice(2)+month.padStart(2,"0")+day.padStart(2,"0")+(hour===undefined?"":hour.padStart(2,"0")+minute);
  }else if((match=text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/))){
    const [,year,month,day,hour,minute,second]=match;
    if(Number(year)<2000||Number(year)>2099||Number(second||0)>59)throw new Error("Ngày giờ ngoài phạm vi hợp lệ.");
    code=year.slice(2)+month.padStart(2,"0")+day.padStart(2,"0")+(hour===undefined?"":hour.padStart(2,"0")+minute);
  }else{
    code=text.replace(/\s+/g,"");
    if(/^\d{8}$|^\d{12}$/.test(code)&&code.startsWith("20"))code=code.slice(2);
  }
  if(!/^(?:\d{6}|\d{10})$/.test(code||""))throw new Error("Nhập YYMMDDHHmm ");
  const year=2000+Number(code.slice(0,2)),month=Number(code.slice(2,4)),day=Number(code.slice(4,6));
  const hour=code.length===10?Number(code.slice(6,8)):0,minute=code.length===10?Number(code.slice(8,10)):0;
  const ms=Date.UTC(year,month-1,day,hour,minute),date=new Date(ms);
  if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day||date.getUTCHours()!==hour||date.getUTCMinutes()!==minute)throw new Error("Ngày hoặc giờ không hợp lệ; kiểm tra ngày, tháng, giờ và phút.");
  return {code,dayOnly:code.length===6,minutes:ms/60000};
}
function dtToMinutes(code){
  if(!/^\d{10}$/.test(code))return NaN;
  try{return parseDateQuery(code).minutes}catch{return NaN}
}
function formatDateCode(code){
  return code.slice(4,6)+"/"+code.slice(2,4)+"/20"+code.slice(0,2)+(code.length===10?" "+code.slice(6,8)+":"+code.slice(8,10):"");
}
function findAllBlocks(buf,scanInfo={}){
  const headers=[],out=[];
  for(let st=0;st+64<=buf.length;st++){
    if(buf[st+8]!==0x0F||!bytesEq(buf,st,START_PATTERN))continue;
    const dt=dtHexFromBlock(buf.subarray(st,st+64));
    if(Number.isFinite(dtToMinutes(dt)))headers.push({start:st,dt});
  }
  // Bound each block by the next header so a missing END cannot swallow it.
  // END is normally a full record; older result.bin exports kept only its 9-byte marker.
  for(let i=0;i<headers.length;i++){
    const {start:st,dt}=headers[i],limit=i+1<headers.length?headers[i+1].start:buf.length;
    let end=-1;
    for(let p=st+64;p+END_PATTERN.length<=limit;p+=64){
      if(bytesEq(buf,p,END_PATTERN)){end=Math.min(p+64,limit);break}
    }
    if(end>0)out.push({start:st,end,bytes:buf.subarray(st,end),dt});
  }
  scanInfo.headerCount=headers.length;
  scanInfo.incompleteCount=headers.length-out.length;
  return out;
}
function emptyStats(){const denom={};for(const d of KNOWN_DENOMS)denom[d]={accept:0,reject:0};return{total:0,accept:0,reject:0,amount:0,denom}}
function scanSwitchCassetteEvents(block,blockIndex,dt){
  const found=[];
  const seen=new Set();

  // Robust scan: tìm TẤT CẢ occurrence trong toàn block, không phụ thuộc phase 64-byte.
  // Cấu trúc xác nhận: candidate record start +8 = 4F, +10..+11 = 00 00.
  // Byte +9 là event/cassette sub-code (thường gặp 06, 08...), vì vậy không khóa cứng 06.
  for(let start=64;start+11<block.length;start++){
    if(block[start+8]!==0x4F || block[start+10]!==0x00 || block[start+11]!==0x00) continue;
    if(seen.has(start)) continue;

    // Tránh bắt END marker hoặc candidate quá sát cuối block.
    if(start+63>=block.length) continue;

    seen.add(start);
    const subCode=block[start+9];
    const signature=`4F${hex2(subCode)}0000`;
    found.push({
      block:blockIndex,
      dateTime:dt,
      status:"EVENT",
      event:"Switch Cassette",
      eventOccurrence:found.length+1,
      switchSignature:signature,
      stt:"",denom:"",denomHex:"",confirm:"",width:"",length:"",
      rejectCode:signature,
      errorMeaning:"Switch Cassette",
      denomMeaning:"",
      rejectByCode:false,rejectBySize:false,rejectReason:"",
      serial:"",
      skew:{label:"—",side:"",valid:false},
      isEvent:true,
      offset:start
    });
  }
  return found;
}
function parseBlock(block,index){
  const dt=dtHexFromBlock(block), procCode=block[11]??0;
  const procName=procCode===2?"IV":procCode===4?"WC":procCode===12?"RJ":procCode===13?"TEST":"PROC "+hex2(procCode);
  let templateVersion="";for(let i=18;i<=37&&i<block.length;i++){const c=block[i];if(c>=32&&c<=126)templateVersion+=String.fromCharCode(c)}
  const bv=(templateVersion.match(/VN\d{4}/i)||["VN----"])[0].toUpperCase();
  const records=[],stats=emptyStats();

  // Bill records vẫn parse theo cấu trúc 64 byte.
  for(let off=64;off+63<block.length;off+=64){
    const r=block.slice(off,off+64);if(bytesEq(r,0,END_PATTERN))break;

    // Nếu event nằm đúng phase 64-byte thì bỏ qua ở bill parser;
    // event sẽ được scan độc lập ở bước sau để không bị trùng.
    if(r[8]===0x4F && r[10]===0x00 && r[11]===0x00) continue;

    const stt=r[21];if(!stt)continue;
    const denomHex=rawHex(r[10],r[11]), confirmHex=rawHex(r[25],r[26]);
    const primary=isValidDenomCode(denomHex), confirmOK=isValidDenomCode(confirmHex);
    const denom=primary?DENOM_MAP[denomHex]:denomHex, confirm=confirmOK?DENOM_MAP[confirmHex]:confirmHex;
    const width=r[12], length=r[13], rejectCode=rejectCodeFromRecord(r);
    const skew=decodeSkewDegree(r[16]);
    const rejectByCode=REJECT_CODE_SET.has(rejectCode), rejectBySize=primary?isRejectBySize(denom,width,length):false;
    const status=primary?((rejectByCode||rejectBySize)?"REJECT":"ACCEPT"):"REJECT";
    const predict=primary?denom:(confirmOK?confirm:"Unknown");
    const denomMeaning=primary?"":denomCodeMeaning(denomHex);
    const errMeaning=rejectMeaning(rejectCode);
    const sizeMeaning=rejectBySize?sizeRejectMeaning(denom,width,length):"";
    const rejectReason=[rejectByCode?errMeaning:"",sizeMeaning].filter(Boolean).join(" + ");
    stats.total++;if(status==="ACCEPT")stats.accept++;else stats.reject++;if(KNOWN_DENOMS.includes(predict)){stats.denom[predict][status.toLowerCase()]++;stats.amount+=Number(predict)}
    records.push({block:index,dateTime:dt,status,stt,denom,predictDenom:predict,denomHex,denomMeaning,confirm,confirmHex,width,length,rejectCode,errorMeaning:errMeaning,rejectByCode,rejectBySize,rejectReason,serial:decodeSerial(r),skew,isEvent:false,offset:off});
  }

  // Quét độc lập toàn block để lấy mọi lần Switch Cassette, kể cả lệch phase hoặc có nhiều occurrence.
  records.push(...scanSwitchCassetteEvents(block,index,dt));

  // Giữ đúng thứ tự vật lý trong log.
  records.sort((a,b)=>(a.offset??Number.MAX_SAFE_INTEGER)-(b.offset??Number.MAX_SAFE_INTEGER));
  return{index,dt,procName,bv,records,stats,raw:block};
}
function statsCards(s){return`<div class="cards"><div class="card total"><span>Total Bills</span><b>${s.total}</b></div><div class="card accept"><span>Accept</span><b>${s.accept}</b></div><div class="card reject"><span>Reject</span><b>${s.reject}</b></div><div class="card amount"><span>Total Amount</span><b>${Number(s.amount).toLocaleString("en-US")}</b></div></div>`}
function denomBoxes(s){return`<div class="denom-grid">${KNOWN_DENOMS.map(d=>`<div class="denom-box"><h3>${Number(d).toLocaleString("en-US")}</h3><div class="denom-line"><span class="good">Accept</span><b>${s.denom[d].accept}</b></div><div class="denom-line"><span class="bad">Reject</span><b>${s.denom[d].reject}</b></div></div>`).join("")}</div>`}
function skewHtml(sk){
  if(!sk||!sk.valid)return`<span class="skew-cell">—</span>`;
  const cls=sk.side==="L"?"skewL":"skewR";
  return`<span class="mono">${sk.label}</span>`;
}
function recordRow(r){
  const cls=r.isEvent?"event-row":r.status==="ACCEPT"?"accept-row":"reject-row";
  const effectiveMeaning=displayErrorMeaning(r);
  const search=[r.dateTime,formatDateCode(r.dateTime),r.stt,r.denom,r.predictDenom,r.denomHex,r.denomMeaning,r.serial,r.rejectCode,r.errorMeaning,effectiveMeaning,r.rejectReason,r.skew?.label,r.isEvent?"switch cassette":""].join(" ").toLowerCase();
  const eventLabel=r.isEvent?"Switch Cassette":r.status;
  const sizeNote=r.rejectReason&&r.rejectReason!==r.errorMeaning
    ? `<div class="small-note bad">${r.rejectReason}</div>`:"";
  return`<tr class="${cls}" data-date="${r.dateTime}" data-status="${r.status}" data-skew="${r.skew?.side||""}" data-search="${search}"><td>${r.stt||""}</td><td><span class="badge ${r.status==="EVENT"?"info":r.status}">${eventLabel}</span></td><td class="mono">${displayDenom(r)}</td><td>${r.confirm||""}</td><td>${r.width||""}</td><td>${r.length||""}</td><td>${skewHtml(r.skew)}</td><td class="mono">${r.rejectCode||""}</td><td>${effectiveMeaning}${sizeNote}</td><td class="mono">${r.serial||""}</td></tr>`;
}
function render(){
  const total=emptyStats();for(const b of lastBlocks){total.total+=b.stats.total;total.accept+=b.stats.accept;total.reject+=b.stats.reject;total.amount+=b.stats.amount;for(const d of KNOWN_DENOMS){total.denom[d].accept+=b.stats.denom[d].accept;total.denom[d].reject+=b.stats.denom[d].reject}}
  $("overall").innerHTML=`<div class="panel"><div class="block-head"><h2>Overall</h2><span class="badge info">${lastBlocks.length} block</span></div>${statsCards(total)}${denomBoxes(total)}</div>`;
  $("blocks").innerHTML=lastBlocks.map(b=>`<div class="panel"><div class="block-head"><h2>Block ${b.index} • ${b.dt} • ${b.procName} • ${b.bv}</h2><span class="badge info">${b.records.filter(x=>!x.isEvent).length} bills • ${b.records.filter(x=>x.isEvent).length} switch</span></div>${statsCards(b.stats)}<div class="table-wrap"><table><thead><tr><th>STT</th><th>Status/Event</th><th>Denom</th><th>Confirm</th><th>Width</th><th>Length</th><th>SkewD<br></th><th>ECode</th><th>Error Meaning</th><th>Serial</th></tr></thead><tbody>${b.records.map(recordRow).join("")}</tbody></table></div></div>`).join("");
  applyFilter();
}
function applyFilter(){
  const text=$("filterText").value.trim().toLowerCase(),status=$("filterStatus").value,skew=$("filterSkew").value;
  let dateCode="",n=0;
  try{dateCode=parseDateQuery(text).code}catch{}
  document.querySelectorAll("#blocks tbody tr").forEach(tr=>{
    const matchesText=!text||(tr.dataset.search||"").includes(text)||(dateCode&&(tr.dataset.date||"").startsWith(dateCode));
    const ok=matchesText&&(!status||tr.dataset.status===status)&&(!skew||tr.dataset.skew===skew);
    tr.classList.toggle("hidden",!ok);if(ok)n++;
  });
  $("visibleCount").textContent=n+" records";
}
function csvEscape(v){const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function makeCsv(){const h=["Block","DateTime","STT","Status","Event","Denom","DenomHex","DenomMeaning","Confirm","Width","Length","RejectByCode","RejectBySize","RejectReason","SkewDegree","SkewSide","SkewDegreeNumber","SkewByteHex","ErrorCode","ErrorMeaning","Serial"];const lines=[h.join(",")];for(const r of allRecords){lines.push([r.block,r.dateTime,r.stt,r.status,r.isEvent?"Switch Cassette":"",r.denom,r.denomHex,r.denomMeaning||"",r.confirm,r.width,r.length,r.rejectByCode?"YES":"",r.rejectBySize?"YES":"",r.rejectReason||"",r.skew?.label||"",r.skew?.side||"",r.skew?.degree??"",r.skew?.valid?hex2(r.skew.raw):"",r.rejectCode,displayErrorMeaning(r),r.serial].map(csvEscape).join(","))}return lines.join("\r\n")}
function downloadBlob(data,name,type){const blob=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function selectBlocks(blocks,target,maxForward,count,preferredIndex=-1){
  const query=parseDateQuery(target);
  const limit=Math.min(50,Math.max(1,Math.floor(Number(count)||1)));
  if(query.dayOnly)return blocks.filter(b=>b.dt.startsWith(query.code)).slice(0,limit);
  let ix=Number.isInteger(preferredIndex)&&preferredIndex>=0&&blocks[preferredIndex]?.dt===query.code?preferredIndex:blocks.findIndex(b=>b.dt===query.code);
  if(ix<0&&$("autoMinuteSearch").value==="on"){
    let bestDelta=Infinity;
    const forward=Math.min(1440,Math.max(0,Number(maxForward)||0));
    for(let i=0;i<blocks.length;i++){
      const delta=dtToMinutes(blocks[i].dt)-query.minutes;
      if(Number.isFinite(delta)&&delta>=0&&delta<=forward&&delta<bestDelta){ix=i;bestDelta=delta}
    }
  }
  return ix<0?[]:blocks.slice(ix,ix+limit);
}
let cachedLog=null;
function loadLogFile(file){
  if(cachedLog?.file===file)return cachedLog.promise;
  const promise=file.arrayBuffer().then(buffer=>{
    const bytes=new Uint8Array(buffer),scanInfo={};
    return {blocks:findAllBlocks(bytes,scanInfo),scanInfo};
  }).catch(error=>{if(cachedLog?.file===file)cachedLog=null;throw error});
  cachedLog={file,promise};
  return promise;
}
function clearResults(){
  allRecords=[];lastBlocks=[];resultBinBytes=null;csvData="";
  $("blocks").innerHTML="";$("overall").innerHTML="";$("visibleCount").textContent="0 records";
  $("btnCsv").disabled=true;$("btnBin").disabled=true;$("analysisStatus").textContent="";
}
$("file").onchange=async()=>{
  clearResults();$("log").textContent="";
  const f=$("file").files[0];
  $("fileDates").textContent=f?"Đang đọc file…":"";
  if(!f){cachedLog=null;return}
  try{
    const data=await loadLogFile(f);
    if($("file").files[0]===f){
      const {blocks,scanInfo}=data;
      $("fileDates").textContent=blocks.length
        ? "Đã đọc file • "+blocks.length+" block hợp lệ. Nhập DateCode để phân tích."
        : "Không tìm thấy block hoàn chỉnh có ngày giờ hợp lệ trong file.";
      if(scanInfo.incompleteCount)$("fileDates").textContent+=" • Bỏ qua "+scanInfo.incompleteCount+" block thiếu marker kết thúc.";
    }
  }catch(e){
    if($("file").files[0]===f)$("fileDates").textContent="Không đọc được file: "+e.message;
  }
};
$("dateCode").onkeydown=e=>{if(e.key==="Enter"){$("btnAnalyze").click();e.preventDefault()}};
$("btnAnalyze").onclick=async()=>{
  $("btnAnalyze").disabled=true;clearResults();$("log").textContent="";
  const f=$("file").files[0];
  try{
    if(!f)throw new Error("Chọn BV Log File trước.");
    $("analysisStatus").textContent="Đang tìm block…";
    const data=await loadLogFile(f);
    if($("file").files[0]!==f)return;
    const {blocks,scanInfo}=data;
    logLine("Found "+blocks.length+" block(s)");
    if(scanInfo.incompleteCount)logLine("Bỏ qua "+scanInfo.incompleteCount+" block thiếu marker kết thúc.");
    if(!blocks.length)throw new Error("Không tìm thấy block hoàn chỉnh có ngày giờ hợp lệ. Kiểm tra đúng file bv.log / SRUBVInfo.log / result.bin.");
    const query=parseDateQuery($("dateCode").value);
    const sel=selectBlocks(blocks,query.code,$("maxMinuteForward").value,$("blockCount").value,-1);
    logLine("Tìm: "+formatDateCode(query.code)+" ("+query.code+")");
    if(!sel.length)throw new Error("Không có block phù hợp với DateCode và giới hạn phút đã chọn.");
    const merged=new Uint8Array(sel.reduce((sum,b)=>sum+b.bytes.length,0));let offset=0;
    sel.forEach((x,i)=>{
      const pb=parseBlock(x.bytes,i+1);lastBlocks.push(pb);
      for(const record of pb.records)allRecords.push(record);
      merged.set(x.bytes,offset);offset+=x.bytes.length;
      logLine("Block "+(i+1)+": "+pb.dt+" "+pb.procName+", "+pb.stats.total+" bills, SwitchCassette="+pb.records.filter(r=>r.isEvent).length);
    });
    resultBinBytes=merged;csvData=makeCsv();render();
    $("btnCsv").disabled=false;$("btnBin").disabled=false;
    const delta=query.dayOnly?0:dtToMinutes(sel[0].dt)-query.minutes;
    $("analysisStatus").textContent="Đã lấy "+sel.length+" block từ "+formatDateCode(sel[0].dt)+(delta?" (+"+delta+" phút)":"")+".";
    logLine("Skew Degree decoded for "+allRecords.filter(r=>r.skew?.valid).length+" bill records.");
  }catch(e){
    if($("file").files[0]===f){clearResults();$("analysisStatus").textContent=e.message;logLine("ERROR: "+e.message)}
  }finally{$("btnAnalyze").disabled=false}
};
$("btnCsv").onclick=()=>downloadBlob(csvData,"result_skew_degree.csv","text/csv;charset=utf-8");
$("btnBin").onclick=()=>resultBinBytes&&downloadBlob(resultBinBytes,"result.bin","application/octet-stream");
$("filterText").oninput=applyFilter;$("filterStatus").onchange=applyFilter;$("filterSkew").onchange=applyFilter;$("btnClear").onclick=()=>{$("filterText").value="";$("filterStatus").value="";$("filterSkew").value="";applyFilter()};
const topBtn=$("backToTop");window.addEventListener("scroll",()=>topBtn.classList.toggle("show",scrollY>500));topBtn.onclick=()=>scrollTo({top:0,behavior:"smooth"});
</script>
