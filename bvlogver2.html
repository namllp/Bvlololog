<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BV Log Analyzer</title>
<style>
:root{
  --bg:#0f172a;
  --panel:#111827;
  --panel2:#1f2937;
  --line:#374151;
  --text:#f8fafc;
  --muted:#94a3b8;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#d97706;
  --cyan:#0891b2;
  --purple:#7c3aed;
  --orange:#ea580c;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(135deg,#020617,#0f172a 55%,#111827);
  color:var(--text);
  font:14px "Segoe UI",Arial,sans-serif;
}
header{
  padding:16px 22px;
  background:linear-gradient(90deg,#1d4ed8,#0f766e,#7c3aed);
  box-shadow:0 2px 18px #0008;
}
header h1{margin:0;font-size:24px}
header small{color:#dbeafe}
.wrap{padding:18px;max-width:1800px;margin:auto}
.panel{
  background:rgba(31,41,55,.96);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 22px #0007;
}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}
input,select{
  background:#020617;
  border:1px solid #475569;
  color:#fff;
  border-radius:8px;
  padding:9px 10px;
  min-width:140px;
}
input[type=file]{min-width:330px}
button{
  border:none;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  color:white;
  font-weight:700;
  background:var(--blue);
}
button:hover{filter:brightness(1.12)}
button:disabled{background:#475569;cursor:not-allowed}
.btn-green{background:var(--green)}
.btn-cyan{background:var(--cyan)}
.btn-purple{background:var(--purple)}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:12px;
  margin:12px 0;
}
.card{
  background:#020617;
  border:1px solid #334155;
  border-radius:13px;
  padding:13px;
}
.card span{color:#cbd5e1;font-size:12px}
.card b{font-size:25px;display:block;margin-top:5px}
.card.total{border-left:5px solid var(--blue)}
.card.accept{border-left:5px solid var(--green)}
.card.reject{border-left:5px solid var(--red)}
.card.unknown{border-left:5px solid var(--yellow)}
.card.predict{border-left:5px solid var(--purple)}
.card.amount{border-left:5px solid var(--cyan)}
.card.extra{border-left:5px solid var(--orange)}
.block-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}
.block-head h2{margin:0;font-size:18px}
.badge{
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;
  font-weight:800;
  font-size:12px;
}
.badge.ACCEPT{background:#064e3b;color:#bbf7d0}
.badge.REJECT{background:#7f1d1d;color:#fecaca}
.badge.UNKNOWN{background:#78350f;color:#fde68a}
.badge.PREDICT{background:#4c1d95;color:#ddd6fe}
.badge.info{background:#1e3a8a;color:#dbeafe}
.filterbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:end;
  margin-top:10px;
}
.table-wrap{
  max-height:500px;
  overflow:auto;
  border:1px solid #374151;
  border-radius:10px;
}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{
  border-bottom:1px solid #374151;
  border-right:1px solid #374151;
  padding:7px 8px;
  text-align:center;
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  z-index:2;
  background:#374151;
  color:#f9fafb;
  cursor:pointer;
  user-select:none;
}
tr.accept-row{background:rgba(22,163,74,.12)}
tr.reject-row{background:rgba(220,38,38,.16)}
tr.unknown-row{background:rgba(217,119,6,.18)}
tr.predict-row{background:rgba(124,58,237,.18)}
tr.hidden{display:none}
tr:hover{outline:2px solid #60a5fa55}
.denom-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
  gap:10px;
  margin-top:10px;
}
.denom-box{
  background:#020617;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px;
}
.denom-box h3{margin:0 0 8px;font-size:15px}
.denom-line{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #ffffff14;
  padding:5px 0;
}
.good{color:#86efac}
.bad{color:#fca5a5}
.warn{color:#fde68a}
.pred{color:#c4b5fd}
.money{color:#67e8f9}
pre{
  background:#020617;
  color:#cbd5e1;
  padding:10px;
  min-height:120px;
  max-height:180px;
  overflow:auto;
  border-radius:10px;
  border:1px solid #334155;
}
.footer{color:#94a3b8;font-size:12px}

#backToTop{
  position:fixed;
  right:18px;
  bottom:22px;
  z-index:9999;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 24px #0009;
  opacity:.94;
}
#backToTop:hover{filter:brightness(1.15);transform:translateY(-1px)}
#backToTop.show{display:flex}


  .collapse-toggle{
    min-width:auto;
    padding:7px 11px;
    font-size:13px;
    line-height:1;
    background:#e8eef8;
    color:#243447;
    border:1px solid #cbd5e1;
  }
  .collapse-toggle:hover{background:#dfe8f4}
  .collapse-body{display:none}
  .collapse-body.open{display:block}

<body>
<header>
  <h1>BV Log Analyzer</h1>
</header>

<div class="wrap">
  <div class="panel">
    <div class="row">
      <label>BV Log File
        <input type="file" id="file">
      </label>
      <label>DateCode Hex (yymmddhhmm)
        <input id="dateCode" value="2602271613" maxlength="10">
      </label>
      <label>Auto tăng phút
        <select id="autoMinuteSearch">
          <option value="off">Off - đúng DateCode</option>
          <option value="on" selected>On - tìm phút gần nhất</option>
        </select>
      </label>
      <label>Max phút tăng
        <input id="maxMinuteForward" type="number" value="30" min="0" max="1440">
      </label>
      <label>Số block lấy
        <input id="blockCount" type="number" value="3" min="1" max="50">
      </label>
      <button id="btnAnalyze">Extract & Analyze</button>
    </div>
    <div id="downloadLinks" style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"></div>
  </div>

  <div id="overall"></div>

  <div class="panel">
    <div class="block-head">
      <h2>Filter Records</h2>
      <span class="badge info" id="visibleCount">0 records</span>
    </div>
    <div class="filterbar">
      <label>Search Serial / Denom / STT
        <input id="filterText" placeholder="VD: YY657 / 500000 / 12">
      </label>
      <label>Status
        <select id="filterStatus">
          <option value="">All</option>
          <option value="ACCEPT">ACCEPT</option>
          <option value="REJECT">REJECT</option>
          <option value="PREDICT">PREDICT</option>
          <option value="UNKNOWN">UNKNOWN</option>
        </select>
      </label>
      <label>Denom / PredictDenom
        <select id="filterDenom">
          <option value="">All</option>
          <option value="500000">500000</option>
          <option value="200000">200000</option>
          <option value="100000">100000</option>
          <option value="50000">50000</option>
          <option value="20000">20000</option>
          <option value="Unknown">Unknown</option>
        </select>
      </label>
      <button id="btnClear">Clear Filter</button>
    </div>
  </div>

  <div class="panel" id="mergePanel" style="display:none">
    <div class="block-head">
      <h2>Merge Blocks</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="badge info">Gộp 1 hoặc nhiều block đã extract</span>
        <button type="button" class="collapse-toggle" id="btnToggleMerge">▼ Mở</button>
      </div>
    </div>
    <div id="mergeBody" class="collapse-body">
      <div class="row">
        <label>Chọn block cần gộp
          <select id="mergeBlocks" multiple size="6" style="min-width:260px"></select>
        </label>
        <button id="btnMergeBlocks">Merge Selected Blocks</button>
        <button id="btnDownloadMergedCsv" class="btn-green" disabled>Download merged.csv</button>
        <button id="btnDownloadMergedBin" class="btn-cyan" disabled>Download merged.bin</button>
        <button id="btnClearMerge">Clear Merge</button>
      </div>
      <div id="mergeResult" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="panel" id="comparePanel" style="display:none">
    <div class="block-head">
      <h2>Compare Blocks</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="badge info">Chọn nhiều block bằng Ctrl/Command hoặc kéo chọn</span>
        <button type="button" class="collapse-toggle" id="btnToggleCompare">▼ Mở</button>
      </div>
    </div>
    <div id="compareBody" class="collapse-body">
      <div class="row">
        <label>Group A Blocks
          <select id="compareA" multiple size="6" style="min-width:220px"></select>
        </label>
        <label>Group B Blocks
          <select id="compareB" multiple size="6" style="min-width:220px"></select>
        </label>
        <button id="btnCompare">Compare</button>
        <button id="btnClearCompare">Clear Compare</button>
      </div>
      <div id="compareResult" style="margin-top:14px"></div>
    </div>
  </div>

  <div id="blocks"></div>

  <div class="panel">
    <b>Log</b>
    <pre id="log"></pre>
  </div>
</div>
<button id="backToTop" type="button" aria-label="Trở lên đầu trang" title="Trở lên đầu trang">↑</button>

<script>
const START_PATTERN=[0,0,0,0,0,0,0,0,15];
const END_PATTERN=[0,0,0,0,0,0,0,0,95];

const DENOM_MAP={
  "3712":"500000",
  "3711":"200000",
  "3710":"100000",
  "370F":"50000",
  "370E":"20000"
};

const KNOWN_DENOMS=["500000","200000","100000","50000","20000"];
const VALID_DENOM_CODES=new Set(["3712","3711","3710","370F","370E"]);

let csvData="";
let jsonData=null;
let resultBinBytes=null;
let allRecords=[];
let lastParsedBlocks=[];
let lastRawBlocks=[];
let mergedSelectionBytes=null;
let mergedSelectionCsv="";

function logLine(s){
  document.getElementById("log").textContent += s + "\\n";
}

function hexToBytes(s){
  s=(s||"").trim().replace(/\\s+/g,"").toUpperCase();
  if(s.length!==10) throw new Error("DateCode phải đúng 10 ký tự hex");
  const out=[];
  for(let i=0;i<s.length;i+=2){
    const v=parseInt(s.substr(i,2),16);
    if(Number.isNaN(v)) throw new Error("DateCode có ký tự hex không hợp lệ");
    out.push(v);
  }
  return out;
}

function findPattern(buf,pat,offset){
  outer:
  for(let i=offset;i<=buf.length-pat.length;i++){
    for(let j=0;j<pat.length;j++){
      if(buf[i+j]!==pat[j]) continue outer;
    }
    return i;
  }
  return -1;
}

function denomFromBytes(a,b){
  const key=((a<<8)|b).toString(16).toUpperCase().padStart(4,"0");
  return DENOM_MAP[key] || key;
}

function hex2(v){
  return Number(v??0).toString(16).toUpperCase().padStart(2,"0");
}

function rawDenomHex(a,b){
  return ((a<<8)|b).toString(16).toUpperCase().padStart(4,"0");
}

function decodeSerial(rec){
  let s="";
  for(let i=41;i<=59;i+=2){
    if(rec[i]) s += String.fromCharCode(rec[i]);
  }
  return s;
}

function isKnownDenom(d){
  return KNOWN_DENOMS.includes(d);
}

function isValidDenomCode(code){
  return VALID_DENOM_CODES.has(String(code||"").toUpperCase());
}

function denomCodeMeaning(code){
  const c=String(code||"").toUpperCase();
  if(isValidDenomCode(c)) return "";
  return DENOM_CODE_MEANINGS[c] || "Unknown BV result/error code";
}

// Error Meaning ưu tiên:
// 1) Nếu byte 10-11 KHÔNG phải mã mệnh giá hợp lệ: chỉ diễn giải BV result tại byte 10-11.
// 2) Nếu Denom và Confirm đều là mệnh giá hợp lệ VÀ khớp nhau: diễn giải RejectCode byte 14-15.
// 3) Các trường hợp còn lại: để trống Error Meaning, tránh trộn hai tầng mã.
function definedErrorCodeMeaning(code){
  const c=String(code||"0000").toUpperCase();
  if(c==="0000") return "";
  const m=rejectCodeMeaning(c);
  return m==="Chưa có diễn giải" ? "" : m;
}

function buildErrorMeaning(denomHex, primaryIsDenom, confirmHex, confirmIsDenom, rejectCode){
  const d=String(denomHex||"").toUpperCase();
  const cf=String(confirmHex||"").toUpperCase();

  // Ưu tiên 1: DenomCode không phải mệnh giá -> chính byte 10-11 là BV result/error code.
  if(!primaryIsDenom){
    return denomCodeMeaning(d);
  }

  // Ưu tiên 2: Denom và Confirm là mệnh giá hợp lệ và khớp -> diễn giải RejectCode.
  if(confirmIsDenom && d===cf){
    const em=definedErrorCodeMeaning(rejectCode);
    return em || "";
  }

  return "";
}

const DENOM_SIZE_RULES = {
  "500000": { widths:[62,63,64,65,66],    lengths:[148,149,150,151,152] },
  "200000": { widths:[61,62,63,64,65,66],    lengths:[145,146,147,148] },
  "100000": { widths:[61,62,63,64,65,66], lengths:[140,141,142,143,144] },
  "50000":  { widths:[61,62,63,64,65],    lengths:[137,138,139,140] }
};

function isRejectBySize(denom,width,length){
  const rule=DENOM_SIZE_RULES[String(denom||"")];
  if(!rule) return false;
  return !(rule.widths.includes(Number(width)) && rule.lengths.includes(Number(length)));
}

function rejectCodeFromRecord(r){
  return rawDenomHex(r[14],r[15]);
}

// RejectCode xác nhận từ dữ liệu SRUBVLog mới.
// Reject theo ErrorCode độc lập mệnh giá; trạng thái cuối cùng còn OR với RejectBySize.
const REJECT_CODE_SET = new Set([
  "2164","2351",
  "318D","4197","3239","1562","1561","3523","352E","3207","3237","3213","3221","419A",
  "3203","320B","2350","3222","3205","31A2","31A3","318E","3225","31FF"
]);

// ErrorCode có condition nhưng được xác nhận KHÔNG reject.
const NON_REJECT_CODE_MEANINGS = {
  "195B":"SOIL",
  "1955":"SOIL",
  "1959":"SOIL",
  "12D3":"TAPE",
  "16B9":"TAPE",
  "1697":"TAPE",
  "18B4":"SOIL",
  "131D":"TAPE",
  "195F":"SOIL",
  "18C0":"SOIL",
  "18EB":"SOIL",
  "131F":"TAPE"
};

// Diễn giải được chia thành:
// - CONFIRMED: đọc trực tiếp từ màn hình/tool của hãng.
// - INFERRED: suy luận mạnh từ đối chiếu CE62 / Category 3 / dữ liệu BV.
// - RESEARCH: mã nội bộ đã biết là reject nhưng chưa xác định feature cụ thể.
// DenomCode byte 10-11.
// Nếu không phải mã mệnh giá hợp lệ, diễn giải nguyên văn tiếng Anh theo bảng BV của hãng.
const DENOM_CODE_MEANINGS = {

  "3E10": "Short edge too long",
  "3E13": "Short edge too long",
  "3E16": "Short edge too long",
  "3E40": "Long edge too short",
  "3E71": "Double feed",
  "3E75": "Output of thickness sensor is low",

  "AE10": "Too close (Backward)",
  "AE11": "Too close (Forward)",
  "AE21": "Large skew",
  "AE22": "Large skew",
  "AE40": "Transport speed too slow",
  "AEFF": "Note undetected by BV-OUT (BV-IN) sensor",

  "CE02": "Pattern matching ng",
  "CE05": "Pattern matching ng",
  "CE06": "Pattern matching ng",
  "CE09": "Pattern matching ng",
  "CE3D": "Pattern matching ng",
  "CE41": "Pattern matching ng",

  "CE51": "Not Recognized",
  "CE58": "Not Recognized",
  "CE62": "Cat3",
  "CE64": "Not Recognized",
  "CE66": "Not Recognized",
  "CE67": "Not Recognized",
  "CE70": "Not Recognized",
  "CE74": "Media detected at center"
};

const ERROR_CODE_MEANINGS = {
  "0000": "Không có mã lỗi",

  // RejectCode xác nhận
  "2164": "Cat3 / Not Clearly",
  "3221": "Suspect",
  "419A": "Suspect",
  "4197": "Suspect",
  "3225": "Suspect",
  "2351": "Cat3 / Not Clearly",
  "3239": "Cat3 / Not Clearly",
  "1562": "Cat3 / Not Clearly",
  "1561": "Cat3 / Not Clearly",
  "3523": "Cat3 / Not Clearly",
  "352E": "Cat3 / Not Clearly",
  "3207": "Cat3 / Not Clearly",
  "3237": "Cat3 / Not Clearly",
  "3213": "Cat3 / Not Clearly",
  "31A2": "Cat3 / Not Clearly",
  "31A3": "Cat3 / Not Clearly",
  "318E": "Cat3 / Not Clearly",
  "31FF": "Cat3 / Not Clearly",
  "318D": "Cat3 / Not Clearly",
  // Internal validation code đã biết từ các bản trước; hiện KHÔNG dùng làm reject nếu không nằm trong REJECT_CODE_SET
  "2350": "Cat3 / Not Clearly",
  "3205": "Cat3 / Not Clearly",
  "3222": "Cat3 / Not Clearly",
  "3203": "Cat3 / Not Clearly",
  "320B": "Cat3 / Not Clearly",
  // Condition code xác nhận KHÔNG reject
  "195B": "SOIL – accept",
  "1955": "SOIL – accept",
  "195D": "SOIL – accept",
  "1959": "SOIL – accept",
  "1957": "SOIL – accept",
  "195F": "SOIL – accept",
  "197A": "SOIL – accept",
  
  "18B0": "SOIL – accept",
  "18C4": "SOIL – accept",
  "18EF": "SOIL – accept",
  "18C0": "SOIL – accept",
  "18EB": "SOIL – accept",
  "18B4": "SOIL – accept",
  "18E4": "SOIL – accept",
  "18FB": "SOIL – accept",
  "18B1": "SOIL – accept",
  
  "12E5": "SOIL – accept",
  "12D3": "TAPE – accept",
  "12F7": "TAPE – accept",
  "12F5": "TAPE – accept",
  
  "16D3": "SOIL – accept",
  "16B9": "TAPE – accept",
  "1697": "TAPE – accept",
  "169A": "TAPE – accept",
  
  "131F": "TAPE – accept",
  "1323": "TAPE – accept",
  "1301": "TAPE – accept",
  "131D": "TAPE – accept",
  "134A": "TAPE – accept",
  

  

  // Đọc trực tiếp từ màn hình error list của hãng
  "3E16": "Short edge too long",
  "3E40": "Long edge too short",
  "3E71": "Double feed",
  "3E75": "Output of thickness sensor is low",
  "AE10": "Too close (Backward)",
  "AE11": "Too close (Forward)",
  "AE21": "Large skew",
  "AE22": "Large skew",
  "AE40": "Transport speed too slow",
  "AEFF": "Note undetected by BV-OUT (BV-IN) sensor",
  "CE02": "Pattern matching ng",
  "CE05": "Pattern matching ng",
  "CE06": "Pattern matching ng",
  "CE09": "Pattern matching ng",
  "CE3D": "Pattern matching ng",
  "CE41": "Pattern matching ng",
  "CE51": "Not Recognized",
  "CE58": "Not Recognized",
  "CE62": "Category3 Note",
  "CE64": "Not Recognized",
  "CE67": "Not Recognized",
  "CE70": "Not Recognized",
  "CE79": "Not Recognized",

  "3E10": "Short edge too long",
  "3E13": "Short edge too long",
  "CE66": "Not Recognized",
  "CE74": "Media detected at center",
};

function rejectCodeMeaning(code){
  const c=String(code||"0000").toUpperCase();
  if(ERROR_CODE_MEANINGS[c]) return ERROR_CODE_MEANINGS[c];

  // Nhóm Damage 31XY: nibble cao của byte thấp cho biết loại damage.
  // Mapping theo bảng tool hãng: 8=Tape, 9=Tear, A=Hole, B=Soil,
  // C=F.C, D=Graf, E=Dmg7, F=Dmg8.
  if(/^31[0-9A-F]{2}$/.test(c)){
    const family=c[2];
    const map={
      "8":"Tape – băng dính",
      "9":"Tear – rách",
      "A":"Hole – lỗ/thủng",
      "B":"Soil – bẩn/soil",
      "C":"F.C – nhóm F.C (chưa chốt mở rộng tên)",
      "D":"Graf – graffiti/vẽ bẩn",
      "E":"Damage 7",
      "F":"Damage 8"
    };
    if(map[family]) return map[family] + " • subcode " + c[3];
  }

  return "Chưa có diễn giải";
}

function isRejectByCode(denom,rejectCode){
  const code = String(rejectCode||"0000").toUpperCase();
  if(code==="0000") return false;
  if(REJECT_CODE_SET.has(code)) return true;
  if(Object.prototype.hasOwnProperty.call(NON_REJECT_CODE_MEANINGS,code)) return false;
  // Mã chưa được xác nhận: không tự suy ra reject.
  return false;
}

function addStats(dst,src){
  dst.total+=src.total;
  dst.accept+=src.accept;
  dst.reject+=src.reject;
  dst.predict+=src.predict;
  dst.unknown+=src.unknown;
  dst.acceptAmount+=src.acceptAmount;
  dst.rejectAmount+=src.rejectAmount;

  for(const d of KNOWN_DENOMS){
    dst.denom[d].accept+=src.denom[d].accept;
    dst.denom[d].reject+=src.denom[d].reject;
    dst.denom[d].predict+=src.denom[d].predict;
  }
}

function parseBlock(block,blockIndex){
  let dt="";
  for(let i=12;i<=16;i++){
    dt += block[i].toString(16).padStart(2,"0").toUpperCase();
  }

  const procCode = block[11] ?? 0;
  const procName =
    procCode === 0x02 ? "IV" :
    procCode === 0x04 ? "WC" :
    procCode === 0x0C ? "RJ" :
	procCode === 0x0D ? "TEST" :
    ("PROC " + procCode.toString(16).padStart(2,"0").toUpperCase());

  let templateVersion="";
  for(let i=18;i<=37 && i<block.length;i++){
    const c=block[i];
    if(c>=32 && c<=126) templateVersion += String.fromCharCode(c);
  }
  const bvMatch = templateVersion.match(/VN\d{4}/i);
  const bvVersion = bvMatch ? bvMatch[0].toUpperCase() : "VN----";

  const stats=emptyStats();
  const records=[];

  for(let off=64; off+63<block.length; off+=64){
    let isEnd=true;
    for(let i=0;i<8;i++){
      if(block[off+i]!==0){isEnd=false;break;}
    }
    if(isEnd && block[off+8]===95) break;

    const r=block.slice(off,off+64);
    const stt=r[21];
    if(!stt) continue;

    const denomHex=rawDenomHex(r[10],r[11]);
    const confirmHex=rawDenomHex(r[25],r[26]);
    const primaryIsDenom=isValidDenomCode(denomHex);
    const confirmIsDenom=isValidDenomCode(confirmHex);
    const denom=primaryIsDenom ? DENOM_MAP[denomHex] : denomHex;
    const denomMeaning=primaryIsDenom ? `${denom} VND` : denomCodeMeaning(denomHex);
    const confirm=confirmIsDenom ? DENOM_MAP[confirmHex] : confirmHex;
    const width=r[12];
    const length=r[13];
    const rejectCode=rejectCodeFromRecord(r);
    const errorCodeMeaning=definedErrorCodeMeaning(rejectCode);
    const errorMeaning=buildErrorMeaning(denomHex,primaryIsDenom,confirmHex,confirmIsDenom,rejectCode);
    const rejectRuleDenom = primaryIsDenom ? denom : (confirmIsDenom ? confirm : "");
    const rejectByErrorCode=isRejectByCode(rejectRuleDenom,rejectCode);
    const rejectBySize=primaryIsDenom ? isRejectBySize(denom,width,length) : false;
    const rejectByDenomCode=!primaryIsDenom;
    const rejectByCode=rejectByDenomCode || rejectByErrorCode || rejectBySize;
    const serial=decodeSerial(r);

    let status="REJECT";
    let predictDenom=confirmIsDenom ? confirm : "Unknown";

    if(primaryIsDenom){
      predictDenom=denom;
      // Denomination hợp lệ: reject khi ErrorCode nằm trong rule HOẶC Width/Length ngoài rule mệnh giá.
      status = (rejectByErrorCode || rejectBySize) ? "REJECT" : "ACCEPT";
    }else{
      // Byte 10–11 không phải 3712/3711/3710/370F/370E:
      // coi chính DenomCode là BV result/error code và diễn giải theo bảng hãng.
      status="REJECT";
    }

    stats.total++;
    if(status==="ACCEPT"){
      stats.accept++;
      stats.acceptAmount += Number(predictDenom);
      stats.allAmount += Number(predictDenom);
      stats.denom[predictDenom].accept++;
    }else if(status==="REJECT"){
      stats.reject++;
      if(isKnownDenom(predictDenom)){
        stats.rejectAmount += Number(predictDenom);
        stats.allAmount += Number(predictDenom);
        stats.denom[predictDenom].reject++;
      }
    }else if(status==="PREDICT"){
      stats.predict++;
      stats.predictAmount += Number(predictDenom);
      stats.allAmount += Number(predictDenom);
      stats.denom[predictDenom].predict++;
    }else{
      stats.unknown++;
    }

    const rec={
      block:blockIndex,
      dateTime:dt,
      stt,
      status,
      denom,
      denomHex,
      denomMeaning,
      primaryIsDenom,
      confirm,
      confirmHex,
      predictDenom,
      width,
      length,
      rejectCode,
      errorCodeMeaning,
      errorMeaning,
      rejectByErrorCode,
      rejectBySize,
      rejectByDenomCode,
      rejectByCode,
      serial
    };

    records.push(rec);
    allRecords.push(rec);
  }

  return {blockIndex,dt,procCode,procName,templateVersion,bvVersion,records,stats};
}

function denomBoxes(stats){
  let html="";
  for(const d of KNOWN_DENOMS){
    html += `<div class="denom-box">
      <h3>${d}</h3>
      <div class="denom-line"><span class="good">Accept</span><b>${stats.denom[d].accept}</b></div>
      <div class="denom-line"><span class="bad">Reject</span><b>${stats.denom[d].reject}</b></div>
      <div class="denom-line"><span class="pred">Predict</span><b>${stats.denom[d].predict}</b></div>
    </div>`;
  }
  html += `<div class="denom-box">
    <h3>Unknown</h3>
    <div class="denom-line"><span class="warn">Count</span><b>${stats.unknown}</b></div>
  </div>`;
  return html;
}

function recordRow(r){
  const cls = r.status==="ACCEPT" ? "accept-row" :
              r.status==="REJECT" ? "reject-row" :
              r.status==="PREDICT" ? "predict-row" : "unknown-row";
  return `<tr class="${cls}" 
    data-status="${r.status}" 
    data-denom="${r.denom}" 
    data-predict="${r.predictDenom}"
    data-search="${String(r.stt).toLowerCase()} ${String(r.denom).toLowerCase()} ${String(r.denomHex).toLowerCase()} ${String(r.denomMeaning).toLowerCase()} ${String(r.confirm).toLowerCase()} ${String(r.predictDenom).toLowerCase()} ${String(r.rejectCode).toLowerCase()} ${String(r.errorCodeMeaning).toLowerCase()} ${String(r.errorMeaning).toLowerCase()} ${String(r.serial).toLowerCase()}">
      <td>${r.block}</td>
      <td>${r.dateTime}</td>
      <td>${r.stt}</td>
      <td><span class="badge ${r.status}">${r.status}</span></td>
      <td>${r.confirm}</td>
      <td>${r.predictDenom}</td>
      <td>${r.width}</td>
      <td>${r.length}</td>
      <td class="mono"><b>${r.rejectCode}</b></td>
      <td>${r.errorMeaning}</td>
      <td>${r.rejectBySize ? 'YES' : ''}</td>
      <td>${r.rejectByCode ? 'YES' : ''}</td>
      <td>${r.serial}</td>
    </tr>`;
}

  csv += `Reject Bills,${p.stats.reject}\r\n`;
  csv += `Predict Bills,${p.stats.predict}\r\n`;
  csv += `Unknown Bills,${p.stats.unknown}\r\n`;
  csv += `Sum Accept,${p.stats.acceptAmount}\r\n`;
  csv += `Sum Reject,${p.stats.rejectAmount}\r\n`;
  csv += `Sum Predict,${p.stats.predictAmount}\r\n`;
  csv += `Sum All Accept+Reject+Predict,${p.stats.allAmount}\r\n`;
  for(const d of KNOWN_DENOMS){
    csv += `${d} Accept,${p.stats.denom[d].accept}\r\n`;
    csv += `${d} Reject,${p.stats.denom[d].reject}\r\n`;
    csv += `${d} Predict,${p.stats.denom[d].predict}\r\n`;

  return csv;
}

function applyFilters(){
  const q=document.getElementById("filterText").value.trim().toLowerCase();
  const status=document.getElementById("filterStatus").value;
  const denom=document.getElementById("filterDenom").value;
  const rows=document.querySelectorAll(".record-table tbody tr");
  let visible=0;

  rows.forEach(tr=>{
    const text=tr.dataset.search || "";
    const st=tr.dataset.status || "";
    const de=tr.dataset.denom || "";
    const pd=tr.dataset.predict || "";

    let ok=true;
    if(q && !text.includes(q)) ok=false;
    if(status && st!==status) ok=false;
    if(denom){
      if(denom==="Unknown"){
        if(st!=="UNKNOWN") ok=false;
      }else{
        if(de!==denom && pd!==denom) ok=false;
      }
    }

    tr.classList.toggle("hidden",!ok);
    if(ok) visible++;
  });

  document.getElementById("visibleCount").textContent = visible + " records";
}

function sortTable(table, col){
  const tbody=table.querySelector("tbody");
  const rows=Array.from(tbody.querySelectorAll("tr"));
  const asc=table.dataset.sortCol == col && table.dataset.sortDir !== "asc" ? true : !(table.dataset.sortCol == col);
  rows.sort((a,b)=>{
    let av=a.children[col].textContent.trim();
    let bv=b.children[col].textContent.trim();
    const an=Number(av.replace(/,/g,""));
    const bn=Number(bv.replace(/,/g,""));
    if(!Number.isNaN(an) && !Number.isNaN(bn)) return asc ? an-bn : bn-an;
    return asc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  tbody.append(...rows);
  table.dataset.sortCol=col;
  table.dataset.sortDir=asc?"asc":"desc";
  applyFilters();
}

function dateCodeToParts(code){
  code=(code||"").trim();
  if(code.length!==10) throw new Error("DateCode phải đúng 10 ký tự yymmddhhmm");
  const yy=Number(code.slice(0,2));
  const mo=Number(code.slice(2,4));
  const dd=Number(code.slice(4,6));
  const hh=Number(code.slice(6,8));
  const mi=Number(code.slice(8,10));
  if([yy,mo,dd,hh,mi].some(Number.isNaN)) throw new Error("DateCode phải là số dạng yymmddhhmm");
  return {yy,mo,dd,hh,mi};
}

function partsToDateCode(p){
  const pad=n=>String(n).padStart(2,"0");
  return pad(p.yy)+pad(p.mo)+pad(p.dd)+pad(p.hh)+pad(p.mi);
}

function addMinutesToDateCode(code,addMin){
  const p=dateCodeToParts(code);
  const d=new Date(2000+p.yy, p.mo-1, p.dd, p.hh, p.mi + addMin, 0, 0);
  return partsToDateCode({
    yy:d.getFullYear()%100,
    mo:d.getMonth()+1,
    dd:d.getDate(),
    hh:d.getHours(),
    mi:d.getMinutes()
  });
}

function findBlockByDateCode(arr,code){
  const dateBytes=hexToBytes(code);
  let offset=0;
  while(true){
    const s=findPattern(arr,START_PATTERN,offset);
    if(s<0) return -1;
    let ok=true;
    for(let i=0;i<5;i++){
      if(arr[s+12+i]!==dateBytes[i]){
        ok=false;
        break;
      }
    }
    if(ok) return s;
    offset=s+1;
  }
}

function findNearestForwardBlock(arr,baseCode,maxMinutes){
  const tried=[];
  for(let add=0;add<=maxMinutes;add++){
    const code=addMinutesToDateCode(baseCode,add);
    tried.push(code);
    const start=findBlockByDateCode(arr,code);
    if(start>=0){
      return {start,matchedCode:code,minuteOffset:add,tried};
    }
  }
  return {start:-1,matchedCode:null,minuteOffset:null,tried};
}


document.getElementById("btnAnalyze").onclick = async function(){
  document.getElementById("log").textContent="";
  clearDownloadLinks();
  document.getElementById("blocks").innerHTML="";
  document.getElementById("overall").innerHTML="";
  document.getElementById("visibleCount").textContent="0 records";
  csvData="";
  jsonData=null;
  resultBinBytes=null;
  allRecords=[];
  lastParsedBlocks=[];
  lastRawBlocks=[];
  mergedSelectionBytes=null;
  mergedSelectionCsv="";
  document.getElementById("mergePanel").style.display="none";
  document.getElementById("mergeResult").innerHTML="";
  document.getElementById("btnDownloadMergedCsv").disabled=true;
  document.getElementById("btnDownloadMergedBin").disabled=true;
  document.getElementById("comparePanel").style.display="none";
  document.getElementById("compareResult").innerHTML="";
  
  
  

  const f=document.getElementById("file").files[0];
  if(!f){alert("Chọn file bv.log trước");return;}

  const inputDateCode=document.getElementById("dateCode").value.trim();
  try{ hexToBytes(inputDateCode); dateCodeToParts(inputDateCode); }
  catch(e){alert(e.message);return;}

  const blockCount=parseInt(document.getElementById("blockCount").value || "3",10);
  const arr=new Uint8Array(await f.arrayBuffer());
  logLine("Loaded: "+f.name+" ("+arr.length+" bytes)");

  let matchStart=-1;
  let matchedDateCode=inputDateCode;

  if(document.getElementById("autoMinuteSearch").value==="on"){
    const maxMin=parseInt(document.getElementById("maxMinuteForward").value || "30",10);
    const found=findNearestForwardBlock(arr,inputDateCode,maxMin);
    matchStart=found.start;
    matchedDateCode=found.matchedCode || inputDateCode;

    if(matchStart>=0){
      logLine("Input DateCode: "+inputDateCode);
      logLine("Matched DateCode: "+matchedDateCode+" (+"+found.minuteOffset+" phút)");
      document.getElementById("dateCode").value=matchedDateCode;
    }else{
      logLine("Không tìm thấy block từ "+inputDateCode+" tới +" + maxMin + " phút.");
      logLine("Đã thử: " + found.tried.join(", "));
      return;
    }
  }else{
    matchStart=findBlockByDateCode(arr,inputDateCode);
    if(matchStart<0){
      logLine("DateCode not found.");
      return;
    }
    logLine("Found DateCode: "+inputDateCode);
  }

  logLine("Found block offset: "+matchStart);

  let currentStart=matchStart;
  const merged=[];
  const parsedBlocks=[];
  let html="";

  for(let b=0;b<blockCount;b++){
    const end=findPattern(arr,END_PATTERN,currentStart+9);
    if(end<0){
      logLine("End marker not found for block "+(b+1));
      break;
    }

    const block=arr.slice(currentStart,end+9);
    lastRawBlocks.push({blockIndex:b+1, bytes:block});
    for(const byte of block) merged.push(byte);

    const parsed=parseBlock(block,b+1);
    parsedBlocks.push(parsed);
    html += renderBlock(parsed);
    csvData += csvForBlock(parsed);

    logLine(`Block ${b+1}: DateTime=${parsed.dt}, Records=${parsed.stats.total}, Accept=${parsed.stats.accept}, Reject=${parsed.stats.reject}, Predict=${parsed.stats.predict}, Unknown=${parsed.stats.unknown}`);

    const nextStart=findPattern(arr,START_PATTERN,end+9);
    if(nextStart<0) break;
    currentStart=nextStart;
  }

  resultBinBytes=new Uint8Array(merged);
  jsonData={
    sourceFile:f.name,
    dateCode:document.getElementById("dateCode").value.trim(),
    blocks:parsedBlocks
  };

  document.getElementById("blocks").innerHTML=html;
  renderOverall(parsedBlocks);
  lastParsedBlocks = parsedBlocks;
  populateMergeSelector(parsedBlocks);
  populateCompareSelectors(parsedBlocks);

  document.querySelectorAll(".record-table").forEach(table=>{
    table.querySelectorAll("th").forEach((th,i)=>{
      th.addEventListener("click",()=>sortTable(table,i));
    });
  });

  
  
  

  applyFilters();

  makeDownloadLink("linkBin","Tải result.bin",new Blob([resultBinBytes],{type:"application/octet-stream"}),"result.bin");
  makeDownloadLink("linkCsv","Tải result.csv",new Blob(["\uFEFF" + csvData],{type:"text/csv;charset=utf-8"}),"result.csv");
  makeDownloadLink("linkJson","Tải result.json",new Blob([JSON.stringify(jsonData,null,2)],{type:"application/json;charset=utf-8"}),"result.json");

  logLine("Done. Trên iOS hãy bấm link tải thủ công bên trên.");
};
